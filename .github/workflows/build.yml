name: Build Spraute

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mod:
    name: Build mod (MC ${{ matrix.mc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mc: ['1.19.2', '1.20.1']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build mod
        run: ./gradlew :${{ matrix.mc }}:build -x test --no-daemon

      - name: Prepare mod artifact
        shell: bash
        run: |
          mkdir -p mod-artifact
          JAR=$(ls -t "versions/${{ matrix.mc }}/build/libs/"spraute_engine-*.jar | head -1)
          cp "$JAR" "mod-artifact/$(basename "$JAR")"

      - name: Upload mod artifact
        uses: actions/upload-artifact@v4
        with:
          name: mod-${{ matrix.mc }}
          path: mod-artifact/*.jar
          retention-days: 14

  build-studio:
    name: Build Studio (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools rpm

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Build Vite app
        working-directory: app
        run: npm run build

      - name: Build Electron app (Windows)
        if: matrix.os == 'windows-latest'
        working-directory: app
        run: npx electron-builder --win --publish never

      - name: Build Electron app (Linux)
        if: matrix.os == 'ubuntu-latest'
        working-directory: app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --linux --publish never

      - name: Build Electron app (macOS)
        if: matrix.os == 'macos-latest'
        working-directory: app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --mac --publish never

      - name: Upload Studio artifacts
        uses: actions/upload-artifact@v4
        with:
          name: studio-${{ matrix.os }}
          path: |
            app/dist-electron/*.exe
            app/dist-electron/*.exe.blockmap
            app/dist-electron/*.AppImage
            app/dist-electron/*.deb
            app/dist-electron/*.rpm
            app/dist-electron/*.tar.gz
            app/dist-electron/*.dmg
            app/dist-electron/*.zip
            app/dist-electron/latest*.yml
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-mod, build-studio]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/**
          generate_release_notes: true
          fail_on_unmatched_files: false
