pluginManagement {
    repositories {
        gradlePluginPortal()
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'Sponge'
            url = 'https://repo.spongepowered.org/repository/maven-public/'
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.10.0'
}

rootProject.name = 'spraute_engine'

include 'core', 'common', 'forge', 'fabric'

// Which Minecraft to build for: -Pmc=<version>, by default the one in gradle.properties.
// All that differs between versions is in versions/<version>.properties.
def mc = providers.gradleProperty('mc').get()
def versionFile = file("versions/${mc}.properties")
if (!versionFile.exists()) throw new GradleException("No versions/${mc}.properties: see PORTING.md")
def versionProps = new Properties()
versionFile.withInputStream { versionProps.load(it) }
gradle.beforeProject { p ->
    versionProps.each { k, v -> p.ext.set(k, v) }
}
