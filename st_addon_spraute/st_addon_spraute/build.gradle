// What all modules share. The three of them, each knowing less than the next:
//   core    the engine with no game at all
//   common  the engine in Minecraft, with no loader
//   forge   what Forge needs; its jar comes from here
//   fabric  what Fabric needs; its jar comes from here
// See PORTING.md.
group = mod_group_id
version = mod_version

subprojects {
    group = rootProject.group
    version = rootProject.version

    repositories {
        mavenCentral()
        maven {
            name = 'Sponge'
            url = 'https://repo.spongepowered.org/repository/maven-public/'
        }
    }

    plugins.withType(JavaPlugin).configureEach {
        java.toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)
        tasks.withType(JavaCompile).configureEach {
            options.encoding = 'UTF-8'
        }
    }
}
